[package]
name = "hscc"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[dependencies]
toml = "1.0.1"
serde = { version = "1.0.228", features = ["derive"] }
regex = "1.12.3"
anyhow = "1.0.101"
# ONNX 支持
protobuf = "3.7"
# 可选：使用 tract-onnx 进行 ONNX 解析/生成
tract-onnx = { version = "0.21", optional = true }

[features]
default = []
onnx-parser = ["tract-onnx"]

[dev-dependencies]
# 测试相关依赖
pretty_assertions = "1.4"

[profile.test]
# 测试配置
opt-level = 0
debug = true
debug-assertions = true
overflow-checks = true

[profile.release]
# 发布配置
opt-level = 3
debug = false
lto = true