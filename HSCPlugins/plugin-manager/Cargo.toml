[package]
name = "hsc-plugin-manager"
version = "0.1.0"
edition = "2024"
description = "OpenHC Plugin System - Plugin Manager"
authors = ["OpenHC Team"]
license = "Apache-2.0"

[dependencies]
# Serialization
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
serde_json = "1.0"

# Error handling
anyhow = "1.0"
thiserror = "2.0"

# Logging
tracing = "0.1"

# Dynamic loading
libloading = "0.8"

# Path handling
glob = "0.3"

# Bitflags
bitflags = "2.4"

# CLI (for binary)
clap = { version = "4.4", features = ["derive"] }

# Async support (optional)
tokio = { version = "1.0", features = ["sync", "rt"], optional = true }

[features]
default = []
async = ["tokio"]

[lib]
name = "hsc_plugin_manager"
path = "src/lib.rs"

[[bin]]
name = "hsc-plugin-cli"
path = "src/bin/cli.rs"
required-features = []
